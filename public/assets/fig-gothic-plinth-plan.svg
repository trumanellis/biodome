8" height="8" fill="#6d4b2f"/><rect x="770" y="310" width="8" height="8" fill="#6d4b2f"/><path d="M145 389H780" fill="none" stroke="#2d7da4" stroke-width="3"/><path d="M20 394H940" fill="none" stroke="#8d5241" stroke-width="3" stroke-dasharray="8 4"/><text x="820" y="432" class="label-sm">Dry-stone wall*</text><text x="820" y="450" class="label-sm">Drop 2m → 3m</text><text x="480" y="602" text-anchor="middle" style="font-size:12px">*Intended edge-flush siting only. Retaining-face support and installation access require checking.</text><path d="M20 180L940 180" stroke="#8d7858" stroke-dasharray="5 5" fill="none"/><text x="480" y="96" text-anchor="middle" style="font-size:13px">Inland side: mountain slope rises beyond left cage</text><text x="80" y="240" text-anchor="middle" style="font-size:12px">Terrace</text><text x="80" y="256" text-anchor="middle" style="font-size:12px">continues</text><text x="870" y="240" text-anchor="middle" style="font-size:12px">Terrace</text><text x="870" y="256" text-anchor="middle" style="font-size:12px">continues</text></svg>