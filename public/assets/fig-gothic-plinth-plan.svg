<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610">
<style>text{font-family:system-ui,sans-serif;fill:#243c2a;font-size:15px}.title{font-size:23px;font-weight:700}.small{font-size:13px}.dim{fill:#8b6b20;font-weight:600}.wall{fill:url(#stone);stroke:#526052;stroke-width:2}.apron{fill:#dbeef6;stroke:#5683a0}.swale{fill:none;stroke:#468296;stroke-width:3;stroke-dasharray:9 5}.line{stroke:#8b6b20;stroke-width:1} </style>
<defs><pattern id="stone" width="24" height="18" patternUnits="userSpaceOnUse"><rect width="24" height="18" fill="#dad9cf"/><path d="M0 4L9 0 18 4 24 1M0 13L7 8 18 11 24 7M9 0L7 8 10 18M18 4L18 11 22 18" fill="none" stroke="#8e9389" stroke-width="1"/></pattern></defs>
<rect width="100%" height="100%" fill="#fbfaf5"/><text x="480" y="38" text-anchor="middle" class="title">Two continuous gabion plinths — foundation plan</text>
<text x="480" y="64" text-anchor="middle">Pole grid 3m × 10m • six stations at 2m centres • open gable doorways</text>
<rect x="150" y="156" width="624" height="32" class="apron"/>
