<text x="465" y="465" text-anchor="middle" class="small">Right side: outer cage face flush with edge; collection channel at cap</text>
<path d="M162 500H762M162 488V512M762 488V512" class="line"/><text x="462" y="526" text-anchor="middle" class="dim">10m between end pole centres</text>
