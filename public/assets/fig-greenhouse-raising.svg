<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580">
  <defs>
    <style>
      .label { font-family: -apple-system, system-ui, sans-serif; fill: #1a2e1a; font-size: 11px; }
      .label-sm { font-family: -apple-system, system-ui, sans-serif; fill: #555; font-size: 10px; }
      .title { font-family: -apple-system, system-ui, sans-serif; fill: #1a2e1a; font-size: 15px; font-weight: 700; }
      .panel-title { font-family: -apple-system, system-ui, sans-serif; fill: #1a2e1a; font-size: 12px; font-weight: 700; }
      .step-num { font-family: -apple-system, system-ui, sans-serif; fill: white; font-size: 12px; font-weight: 700; }
      .arch1 { stroke: #1a2e1a; stroke-width: 3; fill: none; stroke-linecap: round; }
      .arch2 { stroke: #2d4a2d; stroke-width: 3; fill: none; stroke-linecap: round; }
      .arch3 { stroke: #4a7a4a; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .ground { stroke: #1a2e1a; stroke-width: 1; }
      .ground-fill { fill: #f0ebe3; }
      .plan-circle { fill: none; stroke: #d5cfc5; stroke-width: 8; }
    </style>
  </defs>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" class="title">Raising the Arches — Three Steps</text>

  <!-- ===== PANEL 1: First Pair (side view) ===== -->
  <!-- Panel bounds: x=20-370, y=38-280 -->
  <rect x="20" y="38" width="350" height="242" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <circle cx="40" cy="58" r="12" fill="#1a2e1a"/>
  <text x="40" y="63" text-anchor="middle" class="step-num">1</text>
  <text x="58" y="63" class="panel-title">First pair — self-supporting arch</text>

  <!-- Ground -->
  <rect x="30" y="238" width="330" height="32" class="ground-fill"/>
  <line x1="30" y1="238" x2="360" y2="238" class="ground"/>

  <!-- Posthole markers at 6m apart, scale 35px/m, cx=185 -->
  <!-- Left post hole at x=80, right at x=290 -->
  <ellipse cx="80" cy="240" rx="7" ry="4" fill="#c8b89a" stroke="#8b7355" stroke-width="1"/>
  <ellipse cx="290" cy="240" rx="7" ry="4" fill="#c8b89a" stroke="#8b7355" stroke-width="1"/>
  <text x="80" y="253" text-anchor="middle" class="label-sm">post</text>
  <text x="290" y="253" text-anchor="middle" class="label-sm">post</text>
  <!-- 6m span dimension line -->
  <line x1="80" y1="265" x2="290" y2="265" stroke="#888" stroke-width="0.8"/>
  <line x1="80" y1="261" x2="80" y2="269" stroke="#888" stroke-width="0.8"/>
  <line x1="290" y1="261" x2="290" y2="269" stroke="#888" stroke-width="0.8"/>
  <text x="185" y="273" text-anchor="middle" class="label-sm">6 m span</text>

  <!-- First arch pair — catenary curve, dark green -->
  <!-- Left pole: base at (80,238), apex at (185,98) -->
  <!-- Right pole: base at (290,238), apex at (185,98) -->
  <polyline points="80,238 83,230 88,220 95,207 104,193 116,178 128,162 141,148 153,136 163,126 172,116 179,109 184,103 185,98" class="arch1"/>
  <polyline points="290,238 287,230 282,220 275,207 266,193 254,178 242,162 229,148 217,136 207,126 198,116 191,109 186,103 185,98" class="arch1"/>

  <!-- Crown crossing marker -->
  <circle cx="185" cy="98" r="6" fill="none" stroke="#c9a227" stroke-width="2"/>
  <circle cx="185" cy="98" r="2" fill="#c9a227"/>
  <text x="197" y="95" class="label-sm" style="fill:#c9a227;">crown</text>

  <!-- Stick figure person 1: at apex, holding poles -->
  <!-- Body: head at (185, 80), body down to (185,90), arms out -->
  <circle cx="220" cy="108" r="5" fill="none" stroke="#444" stroke-width="1.5"/>
  <line x1="220" y1="113" x2="220" y2="128" stroke="#444" stroke-width="1.5"/>
  <line x1="213" y1="118" x2="227" y2="115" stroke="#444" stroke-width="1.5"/>
  <line x1="220" y1="128" x2="215" y2="140" stroke="#444" stroke-width="1.5"/>
  <line x1="220" y1="128" x2="225" y2="140" stroke="#444" stroke-width="1.5"/>
  <!-- arm reaching to arch -->
  <line x1="213" y1="118" x2="207" y2="112" stroke="#444" stroke-width="1.5"/>
  <text x="228" y="120" class="label-sm" style="font-style:italic;">holds apex</text>

  <!-- Stick figure person 2: at base, setting post -->
  <circle cx="68" cy="210" r="5" fill="none" stroke="#444" stroke-width="1.5"/>
  <line x1="68" y1="215" x2="68" y2="230" stroke="#444" stroke-width="1.5"/>
  <line x1="61" y1="220" x2="75" y2="220" stroke="#444" stroke-width="1.5"/>
  <line x1="68" y1="230" x2="63" y2="242" stroke="#444" stroke-width="1.5"/>
  <line x1="68" y1="230" x2="73" y2="242" stroke="#444" stroke-width="1.5"/>
  <!-- arm reaching to pole base -->
  <line x1="75" y1="220" x2="80" y2="228" stroke="#444" stroke-width="1.5"/>
  <text x="34" y="207" text-anchor="middle" class="label-sm" style="font-style:italic;">sets</text>
  <text x="34" y="218" text-anchor="middle" class="label-sm" style="font-style:italic;">base</text>

  <!-- ===== PANEL 2: Second Pair (top-down plan view) ===== -->
  <!-- Panel bounds: x=390-740, y=38-280 -->
  <rect x="390" y="38" width="350" height="242" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <circle cx="410" cy="58" r="12" fill="#1a2e1a"/>
  <text x="410" y="63" text-anchor="middle" class="step-num">2</text>
  <text x="428" y="63" class="panel-title">Second pair at 90° — freestanding</text>

  <!-- Dome footprint circle, radius ~85px ≈ 3m radius at ~28px/m -->
  <circle cx="565" cy="168" r="85" class="plan-circle"/>

  <!-- First pair: horizontal diameter in dark green -->
  <line x1="480" y1="168" x2="650" y2="168" stroke="#1a2e1a" stroke-width="3.5" stroke-linecap="round"/>
  <text x="655" y="172" class="label" style="fill:#1a2e1a;">pair 1</text>

  <!-- Second pair: vertical diameter in medium green -->
  <line x1="565" y1="83" x2="565" y2="253" stroke="#2d4a2d" stroke-width="3.5" stroke-linecap="round"/>
  <text x="569" y="80" class="label" style="fill:#2d4a2d;">pair 2</text>

  <!-- 90° arc label -->
  <path d="M 590,168 A 25,25 0 0 0 565,143" fill="none" stroke="#888" stroke-width="1"/>
  <text x="592" y="152" class="label-sm">90°</text>

  <!-- Crown crossing: gold dot at center -->
  <circle cx="565" cy="168" r="8" fill="#c9a227"/>
  <text x="576" y="162" class="label-sm" style="fill:#c9a227;">crown</text>
  <text x="576" y="173" class="label-sm" style="fill:#c9a227;">crossing</text>

  <!-- Note: now freestanding -->
  <text x="565" y="268" text-anchor="middle" class="label-sm" style="font-style:italic;">Two pairs brace each other — no support needed</text>

  <!-- ===== PANEL 3: All Seven Pairs (top-down plan, full width) ===== -->
  <!-- Panel bounds: x=20-740, y=298-560 -->
  <rect x="20" y="298" width="720" height="262" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <circle cx="40" cy="318" r="12" fill="#1a2e1a"/>
  <text x="40" y="323" text-anchor="middle" class="step-num">3</text>
  <text x="58" y="323" class="panel-title">All 7 pairs — crown wire-wrapped</text>

  <!-- Dome footprint circle, larger: radius 105px, centre (390, 420) -->
  <circle cx="390" cy="420" r="105" class="plan-circle"/>

  <!--
    7 pairs = 7 diameter lines, angles 0°, 25.7°, 51.4°, 77.1°, 102.9°, 128.6°, 154.3°
    (25.7° steps, leaving a ~25.7° gap for the door)
    r=105, cx=390, cy=420
  -->

  <!-- Pair 1: 0° (horizontal) — dark green -->
  <line x1="285" y1="420" x2="495" y2="420" stroke="#1a2e1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pair 2: 25.7° — cos25.7°=0.901, sin25.7°=0.434 → dx=94.6, dy=45.6 -->
  <!-- (390−94.6, 420+45.6)=(295,466) to (390+94.6, 420−45.6)=(485,374) -->
  <line x1="295" y1="466" x2="485" y2="374" stroke="#2d4a2d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pair 3: 51.4° — cos51.4°=0.625, sin51.4°=0.781 → dx=65.6, dy=82.0 -->
  <!-- (390−65.6, 420+82.0)=(324,502) to (456,338) -->
  <line x1="324" y1="502" x2="456" y2="338" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pair 4: 77.1° — cos77.1°=0.223, sin77.1°=0.975 → dx=23.4, dy=102.4 -->
  <!-- (390−23.4, 420+102.4)=(367,522) to (413,318) -->
  <line x1="367" y1="522" x2="413" y2="318" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pair 5: 102.9° — cos102.9°=−0.223, sin102.9°=0.975 → dx=−23.4, dy=102.4 -->
  <!-- (390+23.4, 420+102.4)=(413,522) to (367,318) -->
  <line x1="413" y1="522" x2="367" y2="318" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pair 6: 128.6° — cos128.6°=−0.625, sin128.6°=0.781 → dx=−65.6, dy=82.0 -->
  <!-- (390+65.6, 420+82.0)=(456,502) to (324,338) -->
  <line x1="456" y1="502" x2="324" y2="338" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pair 7: 154.3° — cos154.3°=−0.901, sin154.3°=0.434 → dx=−94.6, dy=45.6 -->
  <!-- (390+94.6, 420+45.6)=(485,466) to (295,374) -->
  <line x1="485" y1="466" x2="295" y2="374" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Door gap annotation -->
  <!-- Gap is between pair 1 (0°, left end at 285,420) and pair 2 (25.7°, lower-left end at 295,466) -->
  <!-- Arc sweeps clockwise (sweep-flag=1) from (285,420) down to (295,466) -->
  <path d="M 285,420 A 105,105 0 0 1 295,466" fill="none" stroke="#c9a227" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="252" y="442" text-anchor="middle" class="label" style="fill:#c9a227; font-weight:700;">Door</text>
  <text x="252" y="455" text-anchor="middle" class="label-sm" style="fill:#c9a227;">opening</text>

  <!-- Crown zone: gold circle ~30cm diameter at scale ~105px/3m ≈ 35px/m → 30cm = ~10.5px radius -->
  <circle cx="390" cy="420" r="16" fill="#c9a227" opacity="0.25"/>
  <circle cx="390" cy="420" r="16" fill="none" stroke="#c9a227" stroke-width="2"/>
  <!-- Crown label with leader line -->
  <line x1="406" y1="408" x2="440" y2="388" stroke="#c9a227" stroke-width="0.8"/>
  <text x="443" y="385" class="label-sm" style="fill:#c9a227;">Crown — wire wrap</text>
  <text x="443" y="396" class="label-sm" style="fill:#c9a227;">all 14 poles</text>

  <!-- Spacing annotation: arc from pair 1 right (495,420) toward pair 2 upper-right -->
  <!-- At 70% radius (73.5px): pair1 end=(390+73.5,420)=(464,420), pair2=(390+73.5·cos25.7°,420−73.5·sin25.7°)=(456,388) -->
  <!-- Sweep CCW (sweep-flag=0) from pair1 to pair2 direction -->
  <path d="M 464,420 A 74,74 0 0 0 456,388" fill="none" stroke="#888" stroke-width="1"/>
  <text x="471" y="408" class="label-sm">~25.7°</text>
  <text x="468" y="419" class="label-sm">spacing</text>

  <!-- Bottom caption -->
  <text x="390" y="553" text-anchor="middle" class="label-sm" style="font-style:italic;">14 poles (7 pairs) radiating from crown — each pair is one continuous bent rod through the apex</text>
</svg>
