<svg xmlns="http://www.w3.org/2000/svg" width="960" height="605" viewBox="0 0 960 605"><style>text{font:15px system-ui,sans-serif;fill:#233e2c}.title{font-size:23px;font-weight:700}.small{font-size:13px}.dim{fill:#906b20;font-weight:600}.lead{fill:none;stroke:#667263;stroke-width:1}.cage{fill:url(#stone);stroke:#627263;stroke-width:2}.water{fill:none;stroke:#2d7da4;stroke-width:3}.wood{fill:#c59a65;stroke:#76542d;stroke-width:2}.earth{fill:#e5d3b7}</style><defs><pattern id="stone" width="22" height="18" patternUnits="userSpaceOnUse"><rect width="22" height="18" fill="#d5d7cf"/><path d="M0 4L9 0 17 4 22 1M0 13L7 8 17 11 22 7M9 0L7 8 10 18M17 4L17 11 21 18" fill="none" stroke="#8c9588"/></pattern><pattern id="gravel" width="13" height="11" patternUnits="userSpaceOnUse"><rect width="13" height="11" fill="#ecece3"/><circle cx="4" cy="4" r="2" fill="#a5aaa0"/><circle cx="10" cy="9" r="2" fill="#a5aaa0"/></pattern><pattern id="drystone" width="40" height="26" patternUnits="userSpaceOnUse"><rect width="40" height="26" fill="#c4beac"/><path d="M0 7L13 1 26 5 40 0M0 20L10 13 26 17 40 11M13 1L10 13 17 26M26 5L26 17 35 26" fill="none" stroke="#756f60" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="#fbfaf5"/><text x="480" y="35" text-anchor="middle" class="title">Right terrace edge — longitudinal site relationship</text>
<text x="480" y="62" text-anchor="middle">Front at left, rear at right • approximate drop heights supplied by owner • right-side wall only; no rear return</text>
<path d="M90 170H825V470L90 370Z" fill="url(#drystone)" stroke="#696b5d" stroke-width="2"/>
<path d="M90 370L825 470H900V540H35V370Z" class="earth"/>
<path d="M90 170H825" stroke="#6c614e" stroke-width="4"/>
<text x="450" y="150" text-anchor="middle">Level terrace continues beyond both greenhouse gables</text>
<text x="450" y="265" text-anchor="middle">Existing dry-stone wall — internal structure and footing unmeasured</text>
<path d="M70 170V370M62 170H78M62 370H78M850 170V470M842 170H858M842 470H858" class="lead"/>
<text x="90" y="333" class="dim">Front: at least 2m</text><text x="620" y="433" class="dim">Rear: about 3m</text>
<text x="440" y="509" text-anchor="middle">Lower ground slopes down toward rear</text>
<text x="480" y="578" text-anchor="middle" class="small">Do not route roof water down this face or undermine its toe; outlet and erosion protection need checking.</text></svg>