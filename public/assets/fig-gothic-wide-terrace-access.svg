<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720"><rect width="1100" height="720" fill="#fbfaf5"/><style>text{font-family:Arial,sans-serif;fill:#273e2a;font-size:18px}.title{font-size:26px;font-weight:bold}.small{font-size:15px}.ground{fill:#e5d3b7}.cage{fill:#c3c6ba;stroke:#59624f;stroke-width:2}.pole{fill:none;stroke:#9b733e;stroke-width:6}.dim{stroke:#273e2a;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M7 0L0 3.5L7 7" fill="none" stroke="#273e2a"/></marker><pattern id="stone" width="30" height="20" patternUnits="userSpaceOnUse"><rect width="30" height="20" fill="#c1baa9" stroke="#786f60"/></pattern></defs><text x="45" y="45" class="title">Wide terrace · working access</text><path d="M40 530H945V590H1060V660H40Z" class="ground"/><rect x="945" y="530" width="50" height="85" fill="url(#stone)"/><rect x="300" y="504" width="28" height="26" class="cage"/><rect x="592" y="504" width="28" height="26" class="cage"/><path d="M314 552V526C316 390 385 225 460 110C535 225 604 390 606 526V552" class="pole"/><rect x="304" y="543" width="20" height="14" fill="none" stroke="#64745d"/><rect x="596" y="543" width="20" height="14" fill="none" stroke="#64745d"/><text x="460" y="88" text-anchor="middle">6.5m apex</text><text x="115" y="470">NORTH</text><text x="730" y="470">SOUTH</text><line x1="328" y1="580" x2="592" y2="580" class="dim"/><text x="460" y="610" text-anchor="middle">3m pole grid</text><line x1="620" y1="565" x2="945" y2="565" class="dim"/><text x="780" y="595" text-anchor="middle">≥1m from outer cage face</text><text x="720" y="630" class="small">Low wall height is schematic / unmeasured</text><rect x="150" y="330" width="130" height="198" fill="none" stroke="#497362" stroke-dasharray="8 5" stroke-width="3"/><rect x="650" y="330" width="130" height="198" fill="none" stroke="#497362" stroke-dasharray="8 5" stroke-width="3"/><rect x="410" y="170" width="100" height="358" fill="none" stroke="#497362" stroke-dasharray="8 5" stroke-width="3"/><text x="55" y="280">Level outside access</text><text x="680" y="280">Level outside access</text><text x="530" y="190" class="small">Interior ridge access</text><text x="55" y="665" class="small">Dashed zones indicate tasks, not a scaffold design. Size platforms and outriggers before setting out.</text><text x="55" y="695" class="small">The 1m minimum is not a platform-width allowance. Leave more room where required; keep routes dry.</text></svg>