<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580">
  <defs>
    <style>
      .label { font-family: -apple-system, system-ui, sans-serif; fill: #1a2e1a; font-size: 12px; }
      .label-sm { font-family: -apple-system, system-ui, sans-serif; fill: #555; font-size: 11px; }
      .dim { font-family: -apple-system, system-ui, sans-serif; fill: #c9a227; font-size: 12px; font-weight: 600; }
      .dim-line { stroke: #c9a227; stroke-width: 1; fill: none; }
      .compass { font-family: -apple-system, system-ui, sans-serif; fill: #2d4a2d; font-size: 13px; font-weight: 700; }
      .wall { fill: #d7d2c8; stroke: #8a8276; stroke-width: 1.5; }
      .wall-mesh { stroke: #b3aa99; stroke-width: 0.6; }
      .pocket { fill: #1a2e1a; stroke: #c9a227; stroke-width: 1.5; }
    </style>
    <marker id="arr-s" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" stroke="#c9a227" fill="none" stroke-width="1"/>
    </marker>
    <marker id="arr-e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" stroke="#c9a227" fill="none" stroke-width="1"/>
    </marker>
    <marker id="arr-n" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,8 L3,0 L6,8" stroke="#2d4a2d" fill="none" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title with generous top padding -->
  <text x="480" y="38" text-anchor="middle" class="label" style="font-size:15px; font-weight:700;">Foundation Plan View</text>
  <text x="480" y="60" text-anchor="middle" class="label-sm">Two gabion plinth walls — six pole pockets each, 2m on-centre, 3m apart across the width</text>

  <!--
    60px = 1m. Tunnel 3m × 10m = 180 × 600 px. Footprint x = 180 to 780.
    Plinth walls run along the two pole rows: top centreline y=240, bottom y=420.
    Wall width 40cm = 24px → top wall y=228–252, bottom wall y=408–432.
    Interior floor between the walls: y=252 to 408.
    Pole pockets at x = 180, 300, 420, 540, 660, 780.
  -->

  <!-- Interior floor -->
  <rect x="180" y="252" width="600" height="156" fill="#f0ebe3" stroke="#1a2e1a" stroke-width="1" opacity="0.9"/>

  <!-- Plinth walls (stone bands) -->
  <rect x="180" y="228" width="600" height="24" class="wall"/>
  <rect x="180" y="408" width="600" height="24" class="wall"/>

  <!-- Wall mesh texture -->
  <line x1="180" y1="240" x2="780" y2="240" class="wall-mesh"/>
  <line x1="180" y1="420" x2="780" y2="420" class="wall-mesh"/>
  <g class="wall-mesh">
    <line x1="216" y1="228" x2="216" y2="252"/><line x1="252" y1="228" x2="252" y2="252"/>
    <line x1="336" y1="228" x2="336" y2="252"/><line x1="372" y1="228" x2="372" y2="252"/>
    <line x1="456" y1="228" x2="456" y2="252"/><line x1="492" y1="228" x2="492" y2="252"/>
    <line x1="576" y1="228" x2="576" y2="252"/><line x1="612" y1="228" x2="612" y2="252"/>
    <line x1="696" y1="228" x2="696" y2="252"/><line x1="732" y1="228" x2="732" y2="252"/>
    <line x1="216" y1="408" x2="216" y2="432"/><line x1="252" y1="408" x2="252" y2="432"/>
    <line x1="336" y1="408" x2="336" y2="432"/><line x1="372" y1="408" x2="372" y2="432"/>
    <line x1="456" y1="408" x2="456" y2="432"/><line x1="492" y1="408" x2="492" y2="432"/>
    <line x1="576" y1="408" x2="576" y2="432"/><line x1="612" y1="408" x2="612" y2="432"/>
    <line x1="696" y1="408" x2="696" y2="432"/><line x1="732" y1="408" x2="732" y2="432"/>
  </g>

  <!-- Door opening highlights at both gables (24px wide × 48px tall = 80cm) -->
  <rect x="168" y="306" width="24" height="48" fill="#c9a227" opacity="0.18" stroke="#c9a227" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="768" y="306" width="24" height="48" fill="#c9a227" opacity="0.18" stroke="#c9a227" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Centreline -->
  <line x1="180" y1="330" x2="780" y2="330" stroke="#c9a227" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.55"/>

  <!-- Pole pockets — 6 per wall, set into the wall bands -->
  <g>
    <rect x="173" y="233" width="14" height="14" class="pocket"/>
    <rect x="293" y="233" width="14" height="14" class="pocket"/>
    <rect x="413" y="233" width="14" height="14" class="pocket"/>
    <rect x="533" y="233" width="14" height="14" class="pocket"/>
    <rect x="653" y="233" width="14" height="14" class="pocket"/>
    <rect x="773" y="233" width="14" height="14" class="pocket"/>
    <rect x="173" y="413" width="14" height="14" class="pocket"/>
    <rect x="293" y="413" width="14" height="14" class="pocket"/>
    <rect x="413" y="413" width="14" height="14" class="pocket"/>
    <rect x="533" y="413" width="14" height="14" class="pocket"/>
    <rect x="653" y="413" width="14" height="14" class="pocket"/>
    <rect x="773" y="413" width="14" height="14" class="pocket"/>
  </g>

  <!-- Door frame posts (own footings at the gables) -->
  <rect x="168" y="300" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>
  <rect x="168" y="348" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>
  <rect x="780" y="300" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>
  <rect x="780" y="348" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>

  <!-- Arch lines -->
  <g stroke="#1a2e1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35">
    <line x1="180" y1="240" x2="180" y2="420"/>
    <line x1="300" y1="240" x2="300" y2="420"/>
    <line x1="420" y1="240" x2="420" y2="420"/>
    <line x1="540" y1="240" x2="540" y2="420"/>
    <line x1="660" y1="240" x2="660" y2="420"/>
    <line x1="780" y1="240" x2="780" y2="420"/>
  </g>

  <!-- Arch labels along centreline -->
  <text x="180" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A1</text>
  <text x="300" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A2</text>
  <text x="420" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A3</text>
  <text x="540" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A4</text>
  <text x="660" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A5</text>
  <text x="780" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A6</text>

  <!-- Door labels -->
  <text x="160" y="378" text-anchor="end" class="label" style="font-weight:700; font-size:13px;">Door</text>
  <text x="160" y="392" text-anchor="end" class="label-sm">(north)</text>
  <text x="800" y="378" text-anchor="start" class="label" style="font-weight:700; font-size:13px;">Door</text>
  <text x="800" y="392" text-anchor="start" class="label-sm">(south)</text>

  <!-- Plinth-wall labels -->
  <text x="480" y="222" text-anchor="middle" class="label-sm" style="fill:#6b5; font-weight:600; fill:#7a6f55;">west plinth wall</text>
  <text x="480" y="448" text-anchor="middle" class="label-sm" style="fill:#7a6f55; font-weight:600;">east plinth wall</text>

  <!-- Compass — top left -->
  <text x="64" y="100" text-anchor="middle" class="compass">N</text>
  <line x1="64" y1="106" x2="64" y2="146" stroke="#2d4a2d" stroke-width="1.5" marker-end="url(#arr-n)"/>
  <text x="64" y="172" text-anchor="middle" class="label-sm" style="fill:#3D5A3D;">long axis</text>
  <text x="64" y="186" text-anchor="middle" class="label-sm" style="fill:#3D5A3D;">runs N–S</text>

  <!-- 10m length dim -->
  <line x1="180" y1="432" x2="180" y2="492" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="780" y1="432" x2="780" y2="492" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="180" y1="489" x2="780" y2="489" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="438" y="480" width="84" height="18" rx="2" fill="white" opacity="0.95"/>
  <text x="480" y="493" text-anchor="middle" class="dim">10m length</text>

  <!-- 3m width dim (between wall centrelines) -->
  <line x1="180" y1="240" x2="118" y2="240" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="180" y1="420" x2="118" y2="420" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="121" y1="240" x2="121" y2="420" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="100" y="322" width="42" height="18" rx="2" fill="white" opacity="0.95"/>
  <text x="121" y="335" text-anchor="middle" class="dim">3m</text>

  <!-- 2m pocket spacing -->
  <line x1="180" y1="228" x2="180" y2="170" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="300" y1="228" x2="300" y2="170" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="180" y1="173" x2="300" y2="173" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="218" y="162" width="44" height="16" rx="2" fill="white" opacity="0.95"/>
  <text x="240" y="175" text-anchor="middle" class="dim" style="font-size:11px;">2m</text>

  <!-- 40cm wall width -->
  <line x1="810" y1="228" x2="852" y2="228" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="810" y1="252" x2="852" y2="252" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="849" y1="228" x2="849" y2="252" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <text x="856" y="244" text-anchor="start" class="dim" style="font-size:10px;">40cm</text>

  <!-- 80cm door annotation -->
  <line x1="180" y1="306" x2="80" y2="306" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="180" y1="354" x2="80" y2="354" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="83" y1="306" x2="83" y2="354" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <text x="83" y="378" text-anchor="middle" class="dim" style="font-size:10px;">80cm</text>
  <text x="83" y="392" text-anchor="middle" class="dim" style="font-size:10px;">door</text>

  <!-- Plastic orientation note -->
  <g transform="translate(896, 110)">
    <text x="0" y="0" text-anchor="end" class="label-sm" style="fill:#2563a8; font-weight:700;">Each 8m × 10m sheet</text>
    <text x="0" y="16" text-anchor="end" class="label-sm" style="fill:#2563a8;">covers one full slope.</text>
    <text x="0" y="40" text-anchor="end" class="label-sm" style="fill:#2563a8;">10m runs along the</text>
    <text x="0" y="56" text-anchor="end" class="label-sm" style="fill:#2563a8;">tunnel length (gable</text>
    <text x="0" y="72" text-anchor="end" class="label-sm" style="fill:#2563a8;">to gable).</text>
  </g>

  <!-- Bottom-of-canvas legend -->
  <g transform="translate(70, 540)">
    <rect x="2" y="-7" width="13" height="13" class="pocket"/>
    <text x="22" y="4" class="label-sm">Pole pocket (×12)</text>

    <rect x="150" y="-8" width="22" height="14" class="wall"/>
    <text x="178" y="4" class="label-sm">Gabion plinth wall</text>

    <rect x="320" y="-6" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>
    <text x="338" y="4" class="label-sm">Door post (×4)</text>

    <line x1="450" y1="0" x2="480" y2="0" stroke="#c9a227" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="488" y="4" class="label-sm">Door opening</text>

    <text x="610" y="4" class="label-sm" style="fill:#3D5A3D;">italic A# = arch station</text>

    <text x="800" y="4" class="label-sm" style="font-weight:600;">60px = 1m</text>
  </g>
</svg>
