<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580">
  <defs>
    <style>
      .label { font-family: -apple-system, system-ui, sans-serif; fill: #1a2e1a; font-size: 12px; }
      .label-sm { font-family: -apple-system, system-ui, sans-serif; fill: #555; font-size: 11px; }
      .dim { font-family: -apple-system, system-ui, sans-serif; fill: #c9a227; font-size: 12px; font-weight: 600; }
      .dim-line { stroke: #c9a227; stroke-width: 1; fill: none; }
      .compass { font-family: -apple-system, system-ui, sans-serif; fill: #2d4a2d; font-size: 13px; font-weight: 700; }
    </style>
    <marker id="arr-s" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" stroke="#c9a227" fill="none" stroke-width="1"/>
    </marker>
    <marker id="arr-e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" stroke="#c9a227" fill="none" stroke-width="1"/>
    </marker>
    <marker id="arr-n" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,8 L3,0 L6,8" stroke="#2d4a2d" fill="none" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title with generous top padding -->
  <text x="480" y="38" text-anchor="middle" class="label" style="font-size:15px; font-weight:700;">Foundation Plan View</text>
  <text x="480" y="60" text-anchor="middle" class="label-sm">12 postholes in two parallel rows — 6 per row, 2m on-centre, 3m apart across the width</text>

  <!--
    60px = 1m. Tunnel 3m × 10m = 180 × 600 px.
    Tunnel rect: x = 180 to 780, y = 240 to 420.
    Postholes at x = 180, 300, 420, 540, 660, 780 (6 stations × 2m = 10m at 60px/m → 120px spacing × 5 bays = 600px ✓)
    Top row y=240, bottom row y=420. Centre y=330.
  -->

  <!-- Tunnel footprint fill -->
  <rect x="180" y="240" width="600" height="180" fill="#f0ebe3" stroke="#1a2e1a" stroke-width="2"/>

  <!-- Door opening highlights at both gables (24px wide × 48px tall = 80cm) -->
  <rect x="168" y="306" width="24" height="48" fill="#c9a227" opacity="0.18" stroke="#c9a227" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="768" y="306" width="24" height="48" fill="#c9a227" opacity="0.18" stroke="#c9a227" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Centreline -->
  <line x1="180" y1="330" x2="780" y2="330" stroke="#c9a227" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.55"/>

  <!-- Ground stakes (small dots, 25cm = 15px outside each posthole) -->
  <circle cx="180" cy="225" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="300" cy="225" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="420" cy="225" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="540" cy="225" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="660" cy="225" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="780" cy="225" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="180" cy="435" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="300" cy="435" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="420" cy="435" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="540" cy="435" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="660" cy="435" r="3" fill="#1a2e1a" opacity="0.5"/>
  <circle cx="780" cy="435" r="3" fill="#1a2e1a" opacity="0.5"/>

  <!-- Postholes -->
  <circle cx="180" cy="240" r="8" fill="#1a2e1a"/>
  <circle cx="300" cy="240" r="8" fill="#1a2e1a"/>
  <circle cx="420" cy="240" r="8" fill="#1a2e1a"/>
  <circle cx="540" cy="240" r="8" fill="#1a2e1a"/>
  <circle cx="660" cy="240" r="8" fill="#1a2e1a"/>
  <circle cx="780" cy="240" r="8" fill="#1a2e1a"/>
  <circle cx="180" cy="420" r="8" fill="#1a2e1a"/>
  <circle cx="300" cy="420" r="8" fill="#1a2e1a"/>
  <circle cx="420" cy="420" r="8" fill="#1a2e1a"/>
  <circle cx="540" cy="420" r="8" fill="#1a2e1a"/>
  <circle cx="660" cy="420" r="8" fill="#1a2e1a"/>
  <circle cx="780" cy="420" r="8" fill="#1a2e1a"/>

  <!-- Door frame posts -->
  <rect x="168" y="300" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>
  <rect x="168" y="348" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>
  <rect x="780" y="300" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>
  <rect x="780" y="348" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>

  <!-- Arch lines -->
  <line x1="180" y1="240" x2="180" y2="420" stroke="#1a2e1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>
  <line x1="300" y1="240" x2="300" y2="420" stroke="#1a2e1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>
  <line x1="420" y1="240" x2="420" y2="420" stroke="#1a2e1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>
  <line x1="540" y1="240" x2="540" y2="420" stroke="#1a2e1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>
  <line x1="660" y1="240" x2="660" y2="420" stroke="#1a2e1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>
  <line x1="780" y1="240" x2="780" y2="420" stroke="#1a2e1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>

  <!-- Arch labels along centreline -->
  <text x="180" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A1</text>
  <text x="300" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A2</text>
  <text x="420" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A3</text>
  <text x="540" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A4</text>
  <text x="660" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A5</text>
  <text x="780" y="334" text-anchor="middle" class="label-sm" style="font-style:italic; font-weight:600; fill:#3D5A3D;">A6</text>

  <!-- Door labels — placed below the door opening, well clear of the 3m width dim label -->
  <text x="160" y="378" text-anchor="end" class="label" style="font-weight:700; font-size:13px;">Door</text>
  <text x="160" y="392" text-anchor="end" class="label-sm">(north)</text>
  <text x="800" y="378" text-anchor="start" class="label" style="font-weight:700; font-size:13px;">Door</text>
  <text x="800" y="392" text-anchor="start" class="label-sm">(south)</text>

  <!-- Compass — top left, well clear -->
  <text x="64" y="100" text-anchor="middle" class="compass">N</text>
  <line x1="64" y1="106" x2="64" y2="146" stroke="#2d4a2d" stroke-width="1.5" marker-end="url(#arr-n)"/>
  <text x="64" y="172" text-anchor="middle" class="label-sm" style="fill:#3D5A3D;">long axis</text>
  <text x="64" y="186" text-anchor="middle" class="label-sm" style="fill:#3D5A3D;">runs N–S</text>

  <!-- 10m length dim — well below the rectangle -->
  <line x1="180" y1="420" x2="180" y2="488" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="780" y1="420" x2="780" y2="488" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="180" y1="485" x2="780" y2="485" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="438" y="476" width="84" height="18" rx="2" fill="white" opacity="0.95"/>
  <text x="480" y="489" text-anchor="middle" class="dim">10m length</text>

  <!-- 3m width dim — well to the left of the rectangle -->
  <line x1="180" y1="240" x2="118" y2="240" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="180" y1="420" x2="118" y2="420" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="121" y1="240" x2="121" y2="420" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="100" y="322" width="42" height="18" rx="2" fill="white" opacity="0.95"/>
  <text x="121" y="335" text-anchor="middle" class="dim">3m</text>

  <!-- 2m posthole spacing — well above the rectangle -->
  <line x1="180" y1="240" x2="180" y2="170" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="300" y1="240" x2="300" y2="170" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="180" y1="173" x2="300" y2="173" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="218" y="162" width="44" height="16" rx="2" fill="white" opacity="0.95"/>
  <text x="240" y="175" text-anchor="middle" class="dim" style="font-size:11px;">2m</text>

  <!-- 80cm door annotation — outside left, beneath the door label -->
  <line x1="180" y1="306" x2="80" y2="306" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="180" y1="354" x2="80" y2="354" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="83" y1="306" x2="83" y2="354" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <text x="83" y="378" text-anchor="middle" class="dim" style="font-size:10px;">80cm</text>
  <text x="83" y="392" text-anchor="middle" class="dim" style="font-size:10px;">door</text>

  <!-- Plastic orientation note — top-right, mirroring the compass on the top-left -->
  <g transform="translate(896, 110)">
    <text x="0" y="0" text-anchor="end" class="label-sm" style="fill:#2563a8; font-weight:700;">Each 8m × 10m sheet</text>
    <text x="0" y="16" text-anchor="end" class="label-sm" style="fill:#2563a8;">covers one full slope.</text>
    <text x="0" y="40" text-anchor="end" class="label-sm" style="fill:#2563a8;">10m runs along the</text>
    <text x="0" y="56" text-anchor="end" class="label-sm" style="fill:#2563a8;">tunnel length (gable</text>
    <text x="0" y="72" text-anchor="end" class="label-sm" style="fill:#2563a8;">to gable).</text>
  </g>

  <!-- Bottom-of-canvas legend with breathing room -->
  <g transform="translate(60, 530)">
    <circle cx="8" cy="0" r="6" fill="#1a2e1a"/>
    <text x="22" y="4" class="label-sm">Posthole (×12)</text>

    <rect x="120" y="-6" width="12" height="12" rx="1" fill="#d5cfc5" stroke="#1a2e1a" stroke-width="2"/>
    <text x="138" y="4" class="label-sm">Door post (×4)</text>

    <line x1="240" y1="0" x2="270" y2="0" stroke="#c9a227" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="278" y="4" class="label-sm">Door opening</text>

    <circle cx="380" cy="0" r="3" fill="#1a2e1a" opacity="0.5"/>
    <text x="392" y="4" class="label-sm">Ground stake (×12)</text>

    <text x="540" y="4" class="label-sm" style="fill:#3D5A3D;">italic A# = arch station</text>

    <text x="780" y="4" class="label-sm" style="font-weight:600;">Scale: 60px = 1m</text>
  </g>
</svg>
