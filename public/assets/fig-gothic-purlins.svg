<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540">
  <defs>
    <style>
      .label { font-family: -apple-system, system-ui, sans-serif; fill: #1a2e1a; font-size: 12px; }
      .label-sm { font-family: -apple-system, system-ui, sans-serif; fill: #555; font-size: 11px; }
      .pole { stroke: #5a3a1a; stroke-width: 4; fill: none; stroke-linecap: round; }
      .purlin { stroke: #7a5a30; stroke-width: 4; fill: none; stroke-linecap: round; }
      .ridge { stroke: #7a5a30; stroke-width: 4; fill: none; stroke-linecap: round; }
      .ground-line { stroke: #5a3a1a; stroke-width: 1.5; }
      .ground { fill: #b89968; }
    </style>
  </defs>

  <text x="400" y="26" text-anchor="middle" class="label" style="font-size:15px; font-weight:700;">Purlin Layout — Three Per Side, Tall Tunnel</text>
  <text x="400" y="46" text-anchor="middle" class="label-sm">6 arches × 2m spacing × 10m length, with twin ridge poles at the apex</text>

  <!--
    Oblique projection. Front face: 50px = 1m for arch dims.
    Tunnel width 3m = 150px, apex 6.5m = 325px above ground.
    Front-left base at (90, 480). Front-right base at (240, 480). Front apex at (165, 155).
    Each 2m depth step = +50px right, -16px up.
    6 arches at offsets: 0, 50/-16, 100/-32, 150/-48, 200/-64, 250/-80
  -->

  <!-- Ground (perspective trapezoid) -->
  <path class="ground" d="M 60,480 L 270,480 L 520,400 L 310,400 Z" />
  <line x1="60" y1="480" x2="270" y2="480" class="ground-line"/>
  <line x1="310" y1="400" x2="520" y2="400" class="ground-line"/>
  <line x1="60" y1="480" x2="310" y2="400" class="ground-line"/>
  <line x1="270" y1="480" x2="520" y2="400" class="ground-line"/>

  <!--
    Compute arch curves at each station.
    Front station offset (0, 0):
      Left pole: M 90,480 L 90,430 C 90,348 130,210 165,155 L 175,148
      Right pole: mirror
      Apex: (165, 155)
    Station n offset (n*50, n*-16):
      Apex_n = (165 + 50n, 155 - 16n)
  -->

  <!-- Arch 6 (back, faded) -->
  <g opacity="0.32">
    <path class="pole" d="M 340,400 L 340,350 C 340,268 380,130 415,75" />
    <path class="pole" d="M 490,400 L 490,350 C 490,268 450,130 415,75" />
  </g>
  <!-- Arch 5 -->
  <g opacity="0.46">
    <path class="pole" d="M 290,416 L 290,366 C 290,284 330,146 365,91" />
    <path class="pole" d="M 440,416 L 440,366 C 440,284 400,146 365,91" />
  </g>
  <!-- Arch 4 -->
  <g opacity="0.6">
    <path class="pole" d="M 240,432 L 240,382 C 240,300 280,162 315,107" />
    <path class="pole" d="M 390,432 L 390,382 C 390,300 350,162 315,107" />
  </g>
  <!-- Arch 3 -->
  <g opacity="0.74">
    <path class="pole" d="M 190,448 L 190,398 C 190,316 230,178 265,123" />
    <path class="pole" d="M 340,448 L 340,398 C 340,316 300,178 265,123" />
  </g>
  <!-- Arch 2 -->
  <g opacity="0.87">
    <path class="pole" d="M 140,464 L 140,414 C 140,332 180,194 215,139" />
    <path class="pole" d="M 290,464 L 290,414 C 290,332 250,194 215,139" />
  </g>
  <!-- Arch 1 (front) -->
  <path class="pole" d="M 90,480 L 90,430 C 90,348 130,210 165,155" />
  <path class="pole" d="M 240,480 L 240,430 C 240,348 200,210 165,155" />

  <!-- Twin ridge poles through all apex crossings -->
  <!-- West ridge: ~12px left of each apex -->
  <path class="ridge" d="M 153,167 L 203,151 L 253,135 L 303,119 L 353,103 L 403,87" />
  <!-- East ridge: ~12px right of each apex -->
  <path class="ridge" d="M 177,167 L 227,151 L 277,135 L 327,119 L 377,103 L 427,87" />

  <!--
    Purlins (3 per side):
    Low purlin (~1m up, on the vertical wall): at y_n = 430 - 16n on left, x=90+50n
      Front: (90, 430) → Back: (340, 350) on left
      Right: (240, 430) → (490, 350)
    Mid purlin (~2m up, just past wall-to-curve transition): on left curve at ~(95, 380)
      Front: (95, 380) → Back: (345, 300) on left
      Right: (235, 380) → (485, 300)
    High purlin (~4.5m up, near apex): on left curve at ~(135, 215)
      Front: (135, 215) → Back: (385, 135) on left
      Right: (195, 215) → (445, 135)
  -->

  <!-- Low purlins -->
  <line class="purlin" x1="90" y1="430" x2="340" y2="350" />
  <line class="purlin" x1="240" y1="430" x2="490" y2="350" />

  <!-- Mid purlins -->
  <line class="purlin" x1="95" y1="380" x2="345" y2="300" />
  <line class="purlin" x1="235" y1="380" x2="485" y2="300" />

  <!-- High purlins -->
  <line class="purlin" x1="135" y1="215" x2="385" y2="135" />
  <line class="purlin" x1="195" y1="215" x2="445" y2="135" />

  <!-- Labels -->
  <text x="344" y="354" class="label-sm" style="font-style:italic; font-weight:600; fill:#7a5a30;">low (~1m)</text>
  <line x1="342" y1="356" x2="328" y2="354" stroke="#555" stroke-width="0.6"/>
  <text x="349" y="304" class="label-sm" style="font-style:italic; font-weight:600; fill:#7a5a30;">mid (~2m)</text>
  <line x1="347" y1="306" x2="333" y2="302" stroke="#555" stroke-width="0.6"/>
  <text x="389" y="139" class="label-sm" style="font-style:italic; font-weight:600; fill:#7a5a30;">high (~4.5m)</text>
  <line x1="387" y1="141" x2="372" y2="138" stroke="#555" stroke-width="0.6"/>

  <text x="170" y="92" class="label-sm" style="font-style:italic; font-weight:600; fill:#7a5a30;">twin ridge poles</text>
  <line x1="200" y1="100" x2="180" y2="155" stroke="#555" stroke-width="0.6"/>

  <!-- Height annotations -->
  <text x="20" y="434" class="label-sm" style="fill:#c9a227; font-weight:600;">~1.0m</text>
  <line x1="50" y1="430" x2="86" y2="430" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <text x="20" y="384" class="label-sm" style="fill:#c9a227; font-weight:600;">~2.0m</text>
  <line x1="50" y1="380" x2="91" y2="380" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <text x="20" y="219" class="label-sm" style="fill:#c9a227; font-weight:600;">~4.5m</text>
  <line x1="50" y1="215" x2="131" y2="215" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <text x="20" y="159" class="label-sm" style="fill:#c9a227; font-weight:600;">~6.5m</text>
  <line x1="50" y1="155" x2="161" y2="155" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>

  <!-- Arch labels -->
  <text x="90" y="500" text-anchor="middle" class="label-sm" style="font-weight:600; fill:#3D5A3D;">A1</text>
  <text x="140" y="488" text-anchor="middle" class="label-sm" style="font-weight:600; fill:#3D5A3D; opacity:0.87;">A2</text>
  <text x="190" y="476" text-anchor="middle" class="label-sm" style="font-weight:600; fill:#3D5A3D; opacity:0.74;">A3</text>
  <text x="240" y="464" text-anchor="middle" class="label-sm" style="font-weight:600; fill:#3D5A3D; opacity:0.6;">A4</text>
  <text x="290" y="452" text-anchor="middle" class="label-sm" style="font-weight:600; fill:#3D5A3D; opacity:0.46;">A5</text>
  <text x="340" y="440" text-anchor="middle" class="label-sm" style="font-weight:600; fill:#3D5A3D; opacity:0.32;">A6</text>

  <text x="400" y="520" text-anchor="middle" class="label-sm" style="font-style:italic;">Each purlin run = two ~5.5m poles overlapped 30cm and double-lashed at the join</text>
</svg>
