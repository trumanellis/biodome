<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660">
  <defs>
    <style>
      .label { font-family: -apple-system, system-ui, sans-serif; fill: #1a2e1a; font-size: 12px; }
      .label-sm { font-family: -apple-system, system-ui, sans-serif; fill: #555; font-size: 11px; }
      .pole { stroke: #5a3a1a; stroke-width: 4; fill: none; stroke-linecap: round; }
      .ground { fill: #b89968; }
      .ground-line { stroke: #5a3a1a; stroke-width: 1.5; }
      .cool-arrow { stroke: #2287a8; stroke-width: 2.5; fill: none; }
      .hot-arrow { stroke: #c84a2a; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="cool-head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2287a8"/>
    </marker>
    <marker id="hot-head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c84a2a"/>
    </marker>
  </defs>

  <text x="440" y="40" text-anchor="middle" class="label" style="font-size:15px; font-weight:700;">Ventilation — Stack Effect Through Ridge Vent + Roll-Up Walls</text>
  <text x="440" y="62" text-anchor="middle" class="label-sm">Cross-section: 6.5m of vertical height drives a strong updraft through the ridge gap</text>

  <!--
    50px = 1m. Apex at (440, 240). Base at x=365, x=515. Ground at y=565.
    Wall top at y=515.
  -->

  <!-- Ground -->
  <rect x="0" y="565" width="880" height="75" class="ground"/>
  <line x1="0" y1="565" x2="880" y2="565" class="ground-line"/>

  <!-- Pole — left -->
  <path class="pole" d="M 365,597 L 365,515 C 365,405 400,300 440,245 L 455,235" />
  <!-- Pole — right -->
  <path class="pole" d="M 515,597 L 515,515 C 515,405 480,300 440,245 L 425,235" />

  <!-- Posthole indications -->
  <rect x="357" y="565" width="16" height="32" fill="#a08660" stroke="#5a3a1a" stroke-width="1"/>
  <rect x="507" y="565" width="16" height="32" fill="#a08660" stroke="#5a3a1a" stroke-width="1"/>

  <!-- Twin ridge poles -->
  <circle cx="425" cy="272" r="6" fill="#7a5a30" stroke="#3a2810" stroke-width="1.2"/>
  <circle cx="455" cy="272" r="6" fill="#7a5a30" stroke="#3a2810" stroke-width="1.2"/>

  <!-- Plastic envelope (faint outline) -->
  <path d="M 320,565
           L 320,552
           Q 335,535 372,495
           Q 380,400 405,315
           Q 420,265 432,252"
        fill="none" stroke="#2563a8" stroke-width="1.5" opacity="0.55"/>
  <path d="M 560,565
           L 560,552
           Q 545,535 508,495
           Q 500,400 475,315
           Q 460,265 448,252"
        fill="none" stroke="#2563a8" stroke-width="1.5" opacity="0.55"/>

  <!-- Roll-up walls raised -->
  <line x1="320" y1="565" x2="320" y2="535" stroke="#2563a8" stroke-width="2"/>
  <circle cx="320" cy="531" r="4" fill="#a08660" stroke="#5a3a1a" stroke-width="1"/>
  <line x1="560" y1="565" x2="560" y2="535" stroke="#2563a8" stroke-width="2"/>
  <circle cx="560" cy="531" r="4" fill="#a08660" stroke="#5a3a1a" stroke-width="1"/>

  <!-- Vent cap propped open -->
  <path d="M 419,268 Q 440,220 462,265"
        fill="none" stroke="#2563a8" stroke-width="2.5"/>
  <line x1="461" y1="265" x2="458" y2="271" stroke="#5a3a1a" stroke-width="2"/>

  <!-- Hot air rising arrows through vent -->
  <path d="M 440,265 L 440,160" class="hot-arrow" marker-end="url(#hot-head)"/>
  <path d="M 420,300 Q 420,230 420,150" class="hot-arrow" marker-end="url(#hot-head)" opacity="0.7"/>
  <path d="M 460,300 Q 460,230 460,150" class="hot-arrow" marker-end="url(#hot-head)" opacity="0.7"/>

  <!-- Hot air labels — top, well above the structure -->
  <text x="440" y="120" text-anchor="middle" class="label-sm" style="fill:#c84a2a; font-weight:700; font-size:13px;">hot air rises</text>
  <text x="440" y="138" text-anchor="middle" class="label-sm" style="fill:#c84a2a;">stack effect: 6.5m of vertical height</text>

  <!-- Cool air entering through roll-up walls -->
  <path d="M 220,575 L 310,560" class="cool-arrow" marker-end="url(#cool-head)"/>
  <path d="M 660,575 L 570,560" class="cool-arrow" marker-end="url(#cool-head)"/>
  <text x="200" y="580" text-anchor="end" class="label-sm" style="fill:#2287a8; font-weight:700;">cool air in</text>
  <text x="680" y="580" class="label-sm" style="fill:#2287a8; font-weight:700;">cool air in</text>

  <!-- Internal flow swirls -->
  <path d="M 330,545 Q 365,470 405,330" stroke="#888" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.4"/>
  <path d="M 550,545 Q 515,470 475,330" stroke="#888" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.4"/>

  <!-- Roll-up labels — well clear of the figure -->
  <text x="220" y="540" text-anchor="end" class="label-sm" style="fill:#2563a8; font-style:italic;">roll-up wall lifted</text>
  <line x1="223" y1="544" x2="316" y2="548" stroke="#555" stroke-width="0.6"/>

  <text x="660" y="540" class="label-sm" style="fill:#2563a8; font-style:italic;">roll-up wall lifted</text>
  <line x1="657" y1="544" x2="564" y2="548" stroke="#555" stroke-width="0.6"/>

  <!-- Vent cap label -->
  <text x="600" y="200" class="label-sm" style="fill:#2563a8; font-weight:700;">vent cap propped open</text>
  <line x1="598" y1="204" x2="466" y2="225" stroke="#555" stroke-width="0.6"/>

  <!-- Apex label -->
  <text x="700" y="248" class="label-sm" style="fill:#c9a227; font-weight:600;">6.5m apex</text>
  <line x1="698" y1="244" x2="468" y2="240" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>

  <!-- Three modes legend (well below figure) -->
  <g transform="translate(60, 620)">
    <text x="0" y="0" class="label-sm" style="font-weight:700; fill:#3D5A3D;">Modes:</text>
    <circle cx="60" cy="-3" r="4" fill="#2563a8" opacity="0.8"/>
    <text x="70" y="0" class="label-sm">Sealed (winter — vent closed, walls down)</text>
    <circle cx="320" cy="-3" r="4" fill="#c9a227" opacity="0.8"/>
    <text x="330" y="0" class="label-sm">Mild (spring/autumn — vent ajar, walls partial)</text>
    <circle cx="600" cy="-3" r="4" fill="#c84a2a" opacity="0.8"/>
    <text x="610" y="0" class="label-sm">Hot (shown above — vent open, walls fully up)</text>
  </g>
</svg>
