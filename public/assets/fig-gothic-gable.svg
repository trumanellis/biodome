<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820">
  <defs>
    <style>
      .label { font-family: -apple-system, system-ui, sans-serif; fill: #1a2e1a; font-size: 12px; }
      .label-sm { font-family: -apple-system, system-ui, sans-serif; fill: #555; font-size: 11px; }
      .dim { font-family: -apple-system, system-ui, sans-serif; fill: #c9a227; font-size: 12px; font-weight: 600; }
      .dim-line { stroke: #c9a227; stroke-width: 1; fill: none; }
      .pole { stroke: #5a3a1a; stroke-width: 5; fill: none; stroke-linecap: round; }
      .infill { stroke: #7a5a30; stroke-width: 4; fill: none; stroke-linecap: round; }
      .door-post { stroke: #5a3a1a; stroke-width: 6; fill: none; stroke-linecap: round; }
      .ground { fill: #b89968; }
      .ground-line { stroke: #5a3a1a; stroke-width: 2; }
    </style>
    <marker id="arr-s" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" stroke="#c9a227" fill="none" stroke-width="1"/>
    </marker>
    <marker id="arr-e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" stroke="#c9a227" fill="none" stroke-width="1"/>
    </marker>
  </defs>

  <text x="350" y="40" text-anchor="middle" class="label" style="font-size:15px; font-weight:700;">Gable End Framing — Front Elevation</text>
  <text x="350" y="62" text-anchor="middle" class="label-sm">Tall gable triangle (~14m²) divided by a central vertical and two simple diagonals into four claddable bays</text>

  <!--
    70px = 1m. Apex at (350, 245). Base posts at x=245 (left), x=455 (right). 3m apart.
    Ground at y=720. Wall vertical 1m × 70 = 70px → wall top at y=650.
    Door 80cm wide × 2.1m tall: door posts at x=322, x=378 (56px = 80cm). Lintel at y = 720 - 147 = 573.
    Vertical infill: from lintel centre (350, 573) up to apex (350, 245).
    Diagonals: from each door post top to a point on the gable arch about 2/3 of the way up the wall+lower-curve.
      Left diagonal endpoint: ~(245, 540) on left arch curve (just where the wall meets the curve, slightly into the curve)
      Right diagonal endpoint: ~(455, 540) on right arch
  -->

  <!-- Ground -->
  <rect x="0" y="720" width="700" height="80" class="ground"/>
  <line x1="0" y1="720" x2="700" y2="720" class="ground-line"/>

  <!-- Posthole indications — arch poles -->
  <rect x="237" y="720" width="16" height="32" fill="#a08660" stroke="#5a3a1a" stroke-width="1"/>
  <rect x="447" y="720" width="16" height="32" fill="#a08660" stroke="#5a3a1a" stroke-width="1"/>

  <!-- Posthole indications — door posts -->
  <rect x="316" y="720" width="12" height="32" fill="#a08660" stroke="#5a3a1a" stroke-width="1"/>
  <rect x="372" y="720" width="12" height="32" fill="#a08660" stroke="#5a3a1a" stroke-width="1"/>

  <!-- Gable arch (outermost arch — same gothic shape as cross-section) -->
  <path class="pole" d="M 245,752 L 245,650 C 245,490 290,320 350,245 L 370,233" />
  <path class="pole" d="M 455,752 L 455,650 C 455,490 410,320 350,245 L 330,233" />

  <!-- Wire at apex -->
  <g stroke="#888" stroke-width="1.2" fill="none" opacity="0.85">
    <ellipse cx="350" cy="245" rx="20" ry="9" transform="rotate(-15 350 245)"/>
    <ellipse cx="350" cy="245" rx="20" ry="9" transform="rotate(15 350 245)"/>
  </g>

  <!-- Door posts (vertical, ground to lintel) -->
  <line class="door-post" x1="322" y1="752" x2="322" y2="573" />
  <line class="door-post" x1="378" y1="752" x2="378" y2="573" />

  <!-- Door lintel -->
  <line class="door-post" x1="316" y1="573" x2="384" y2="573" />

  <!-- Door opening (dashed rect) -->
  <rect x="322" y="573" width="56" height="147" fill="#fff8e8" fill-opacity="0.4" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Vertical infill spar from door lintel centre up to apex -->
  <line class="infill" x1="350" y1="573" x2="350" y2="257" />

  <!-- Two simple diagonals: door post tops out to the gable arch -->
  <line class="infill" x1="322" y1="573" x2="246" y2="540" />
  <line class="infill" x1="378" y1="573" x2="454" y2="540" />

  <!-- "Door" / "opening" inside the door rectangle -->
  <text x="350" y="638" text-anchor="middle" class="label" style="font-weight:700;">Door</text>
  <text x="350" y="654" text-anchor="middle" class="label-sm">opening</text>

  <!-- Apex label -->
  <text x="350" y="215" text-anchor="middle" class="label" style="font-weight:700; fill:#3D5A3D;">apex</text>
  <text x="350" y="229" text-anchor="middle" class="label-sm" style="fill:#3D5A3D;">(6.5m)</text>

  <!-- Vertical infill label -->
  <text x="500" y="396" class="label-sm" style="font-style:italic; fill:#7a5a30; font-weight:600;">vertical infill</text>
  <text x="500" y="410" class="label-sm" style="font-style:italic; fill:#7a5a30;">spar</text>
  <line x1="497" y1="402" x2="354" y2="402" stroke="#555" stroke-width="0.6"/>

  <!-- Diagonal labels -->
  <text x="160" y="568" text-anchor="end" class="label-sm" style="font-style:italic; fill:#7a5a30; font-weight:600;">diagonal</text>
  <text x="160" y="582" text-anchor="end" class="label-sm" style="font-style:italic; fill:#7a5a30;">infill</text>
  <line x1="163" y1="572" x2="285" y2="556" stroke="#555" stroke-width="0.6"/>

  <text x="540" y="568" class="label-sm" style="font-style:italic; fill:#7a5a30; font-weight:600;">diagonal</text>
  <text x="540" y="582" class="label-sm" style="font-style:italic; fill:#7a5a30;">infill</text>
  <line x1="537" y1="572" x2="415" y2="556" stroke="#555" stroke-width="0.6"/>

  <!-- Gable arch label -->
  <text x="120" y="690" text-anchor="end" class="label-sm" style="font-style:italic;">gable arch</text>
  <text x="120" y="704" text-anchor="end" class="label-sm" style="font-style:italic;">(same as A1/A6)</text>
  <line x1="124" y1="694" x2="206" y2="694" stroke="#555" stroke-width="0.6"/>

  <!-- Door post label -->
  <text x="540" y="690" class="label-sm" style="font-style:italic;">door post</text>
  <text x="540" y="704" class="label-sm" style="font-style:italic;">(9–11cm dia)</text>
  <line x1="537" y1="694" x2="384" y2="694" stroke="#555" stroke-width="0.6"/>

  <!-- Bays callout (subtle highlight numbers) -->
  <text x="290" y="455" text-anchor="middle" class="label-sm" style="fill:#7A9A7A; opacity:0.8;">bay 1</text>
  <text x="410" y="455" text-anchor="middle" class="label-sm" style="fill:#7A9A7A; opacity:0.8;">bay 2</text>
  <text x="290" y="320" text-anchor="middle" class="label-sm" style="fill:#7A9A7A; opacity:0.8;">bay 3</text>
  <text x="410" y="320" text-anchor="middle" class="label-sm" style="fill:#7A9A7A; opacity:0.8;">bay 4</text>

  <!-- Dimensions -->

  <!-- 3m base width -->
  <line x1="245" y1="752" x2="245" y2="790" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="455" y1="752" x2="455" y2="790" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="245" y1="787" x2="455" y2="787" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="332" y="778" width="36" height="18" rx="2" fill="white" opacity="0.95"/>
  <text x="350" y="791" text-anchor="middle" class="dim">3m</text>

  <!-- Door height 2.1m (right of door) -->
  <line x1="378" y1="573" x2="430" y2="573" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="378" y1="720" x2="430" y2="720" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="427" y1="573" x2="427" y2="720" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="436" y="638" width="44" height="18" rx="2" fill="white" opacity="0.95"/>
  <text x="458" y="651" text-anchor="middle" class="dim">2.1m</text>

  <!-- Door width 80cm -->
  <line x1="322" y1="573" x2="322" y2="540" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="378" y1="573" x2="378" y2="540" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="322" y1="543" x2="378" y2="543" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="328" y="528" width="44" height="14" rx="2" fill="white" opacity="0.95"/>
  <text x="350" y="540" text-anchor="middle" class="dim" style="font-size:11px;">80cm</text>

  <!-- 6.5m apex (far right) -->
  <line x1="350" y1="245" x2="640" y2="245" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="455" y1="720" x2="640" y2="720" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="635" y1="245" x2="635" y2="720" class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <rect x="644" y="476" width="48" height="18" rx="2" fill="white" opacity="0.95"/>
  <text x="668" y="489" text-anchor="middle" class="dim">6.5m</text>
</svg>
